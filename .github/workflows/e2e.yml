name: E2E

# Blocking on pushes to the main branches; informational (non-blocking) on pull requests.
on:
  push:
    branches: [main, master, dev]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: E2E smoke (web + api)
    runs-on: ubuntu-latest
    # PRs: report failures without blocking the merge.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduforge:eduforge@127.0.0.1:5432/eduforge
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: development
      AUTH_SECRET: ci-test-secret
      WEB_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "0"
      # Seed has no default admin password; tests log in with the same value.
      ADMIN_PASSWORD: admin12345
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:4001
      SKIP_E2E: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      # One turbo run builds each package once, in dependency order (cached in .turbo/cache).
      - run: pnpm exec turbo run build --filter=@eduforge/chess-core --filter=@eduforge/shared --filter=@eduforge/content --filter=@eduforge/judge --filter=@eduforge/circuit-engine --filter=@eduforge/db --filter=@eduforge/api
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Start API
        run: |
          pnpm --filter @eduforge/api start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4000/health
      - name: Start Web
        # Job NODE_ENV stays development for the API. next build/start require production.
        env:
          NODE_ENV: production
        run: |
          pnpm --filter @eduforge/web build
          pnpm --filter @eduforge/web start &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3000 && break
            sleep 2
          done
      - name: Install Playwright browser
        run: pnpm --filter @eduforge/web exec playwright install chromium --with-deps
      - name: E2E smoke
        run: pnpm --filter @eduforge/web exec playwright test e2e/smoke.spec.ts --grep "landing|pricing|courses catalog|register|login admin|review inbox|openapi"
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
