name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eduforge/shared build
      - run: pnpm --filter @eduforge/content build
      - run: pnpm --filter @eduforge/chess-core build
      - run: pnpm --filter @eduforge/db build
      - name: Unit tests
        run: pnpm test:unit
      - name: Typecheck
        run: pnpm typecheck

  # Playwright smoke — skipped by default (needs full stack). Enable with:
  #   workflow_dispatch or set repo var RUN_E2E=true
  e2e:
    name: E2E smoke (optional)
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eduforge/web exec playwright install --with-deps chromium
      - name: E2E (expects stack at localhost — use SKIP_E2E if not)
        env:
          SKIP_E2E: ${{ vars.SKIP_E2E || '1' }}
        run: pnpm test:e2e
        continue-on-error: true

  integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduforge:eduforge@localhost:5432/eduforge
      NODE_ENV: development
      AUTH_SECRET: ci-test-secret
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eduforge/shared build
      - run: pnpm --filter @eduforge/content build
      - run: pnpm --filter @eduforge/chess-core build
      - run: pnpm --filter @eduforge/db build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @eduforge/api test:integration
