name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eduforge/shared build
      - run: pnpm --filter @eduforge/content build
      - run: pnpm --filter @eduforge/chess-core build
      - run: pnpm --filter @eduforge/judge build
      - run: pnpm --filter @eduforge/db build
      - name: Unit tests
        run: pnpm test:unit
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduforge:eduforge@127.0.0.1:5432/eduforge
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: development
      AUTH_SECRET: ci-test-secret
      WEB_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # API imports @eduforge/judge — must build before integration tests
      - run: pnpm --filter @eduforge/shared build
      - run: pnpm --filter @eduforge/content build
      - run: pnpm --filter @eduforge/chess-core build
      - run: pnpm --filter @eduforge/judge build
      - run: pnpm --filter @eduforge/db build
      - run: pnpm --filter @eduforge/api build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @eduforge/api test:integration

  content-gate:
    name: Content integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eduforge/shared build
      - run: pnpm --filter @eduforge/content build
      - name: Content + MDX tests
        run: pnpm --filter @eduforge/content test

  e2e-smoke:
    name: E2E smoke (web + api)
    runs-on: ubuntu-latest
    needs: [unit, integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduforge:eduforge@127.0.0.1:5432/eduforge
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: development
      AUTH_SECRET: ci-test-secret
      WEB_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "0"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:4001
      SKIP_E2E: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eduforge/shared build
      - run: pnpm --filter @eduforge/content build
      - run: pnpm --filter @eduforge/chess-core build
      - run: pnpm --filter @eduforge/judge build
      - run: pnpm --filter @eduforge/db build
      - run: pnpm --filter @eduforge/api build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Start API
        run: |
          pnpm --filter @eduforge/api start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4000/health
      - name: Start Web
        run: |
          pnpm --filter @eduforge/web build
          pnpm --filter @eduforge/web start &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3000 && break
            sleep 2
          done
      - name: Install Playwright browser
        run: pnpm --filter @eduforge/web exec playwright install chromium --with-deps
      - name: E2E smoke
        run: pnpm --filter @eduforge/web exec playwright test e2e/smoke.spec.ts --grep "landing|pricing|courses catalog|register|login admin|review inbox|openapi"
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
