name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eduforge/shared build
      - run: pnpm --filter @eduforge/content build
      - run: pnpm --filter @eduforge/chess-core build
      - run: pnpm --filter @eduforge/judge build
      - run: pnpm --filter @eduforge/db build
      - name: Unit tests
        run: pnpm test:unit
      - name: Typecheck
        run: pnpm typecheck

  integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduforge:eduforge@127.0.0.1:5432/eduforge
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: development
      AUTH_SECRET: ci-test-secret
      WEB_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # API imports @eduforge/judge — must build before integration tests
      - run: pnpm --filter @eduforge/shared build
      - run: pnpm --filter @eduforge/content build
      - run: pnpm --filter @eduforge/chess-core build
      - run: pnpm --filter @eduforge/judge build
      - run: pnpm --filter @eduforge/db build
      - run: pnpm --filter @eduforge/api build
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @eduforge/api test:integration

  e2e:
    name: E2E smoke (compose stack)
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 45
    env:
      # Prefer 127.0.0.1 over localhost (IPv6 quirks on GHA runners)
      DATABASE_URL: postgresql://eduforge:eduforge@127.0.0.1:5432/eduforge
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-test-secret
      WEB_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:4001
      NEXT_PUBLIC_WEB_ORIGIN: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      API_PORT: "4000"
      REALTIME_PORT: "4001"
      # Keep non-production for session cookies on http://
      NODE_ENV: development
      COOKIE_SECURE: "0"
      SKIP_E2E: "0"
      CI: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: |
          pnpm --filter @eduforge/shared build
          pnpm --filter @eduforge/content build
          pnpm --filter @eduforge/chess-core build
          pnpm --filter @eduforge/judge build
          pnpm --filter @eduforge/db build
          pnpm --filter @eduforge/api build
          pnpm --filter @eduforge/realtime build
          # next build embeds NEXT_PUBLIC_* from env above
          pnpm --filter @eduforge/web build
      - name: Migrate + seed
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Install Playwright Chromium
        run: pnpm --filter @eduforge/web exec playwright install --with-deps chromium
      - name: Start API + realtime + web
        run: |
          set +e
          pnpm --filter @eduforge/api start > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          pnpm --filter @eduforge/realtime start > /tmp/realtime.log 2>&1 &
          echo $! > /tmp/realtime.pid
          pnpm --filter @eduforge/web start > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          ready=0
          for i in $(seq 1 90); do
            api_ok=0; rt_ok=0; web_ok=0
            curl -sf http://127.0.0.1:4000/health >/dev/null && api_ok=1
            curl -sf http://127.0.0.1:4001/health >/dev/null && rt_ok=1
            curl -sf http://127.0.0.1:3000 >/dev/null && web_ok=1
            echo "wait $i api=$api_ok rt=$rt_ok web=$web_ok"
            if [ "$api_ok" = "1" ] && [ "$rt_ok" = "1" ] && [ "$web_ok" = "1" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "stack failed to become ready"
            echo "=== api.log ===" && cat /tmp/api.log || true
            echo "=== realtime.log ===" && cat /tmp/realtime.log || true
            echo "=== web.log ===" && tail -n 120 /tmp/web.log || true
            exit 1
          fi
          echo "stack ready"
      - name: E2E smoke
        run: pnpm --filter @eduforge/web test:e2e
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== api.log ===" && cat /tmp/api.log || true
          echo "=== realtime.log ===" && cat /tmp/realtime.log || true
          echo "=== web.log ===" && tail -n 120 /tmp/web.log || true
