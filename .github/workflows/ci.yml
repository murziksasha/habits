name: CI

on:
  push:
    branches: [main, master, dev, deepImprovements, seedFeat]
  # Every pull request, whatever its base branch (feature → feature PRs included).
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      # One turbo run builds each package once, in dependency order (cached in .turbo/cache).
      - run: pnpm exec turbo run build --filter=@eduforge/chess-core --filter=@eduforge/shared --filter=@eduforge/content --filter=@eduforge/judge --filter=@eduforge/circuit-engine --filter=@eduforge/db
      - name: Unit tests
        run: pnpm test:unit
      - name: Typecheck
        run: pnpm typecheck
      - name: Migration journal check
        run: pnpm migrate check
      - name: Lint
        run: pnpm lint
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eduforge:eduforge@127.0.0.1:5432/eduforge
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: development
      AUTH_SECRET: ci-test-secret
      WEB_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      # API imports @eduforge/judge — must build before integration tests
      # One turbo run builds each package once, in dependency order (cached in .turbo/cache).
      - run: pnpm exec turbo run build --filter=@eduforge/chess-core --filter=@eduforge/shared --filter=@eduforge/content --filter=@eduforge/judge --filter=@eduforge/circuit-engine --filter=@eduforge/db --filter=@eduforge/api
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @eduforge/api test:integration
      # Same suite with Redis unreachable: the API must fall back to memory quickly.
      - name: API integration without Redis
        run: pnpm --filter @eduforge/api test:integration
        env:
          REDIS_URL: redis://127.0.0.1:1
      - name: Realtime game races (Postgres)
        run: pnpm --filter @eduforge/realtime test:integration

  content-gate:
    name: Content integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      # One turbo run builds each package once, in dependency order (cached in .turbo/cache).
      - run: pnpm exec turbo run build --filter=@eduforge/chess-core --filter=@eduforge/shared --filter=@eduforge/content
      - name: Content + MDX tests
        run: pnpm --filter @eduforge/content test

  labs-verify:
    name: ForgeBoard labs (starter/solution/broken)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LABS_DATABASE_URL: postgresql://eduforge:eduforge@127.0.0.1:5432/eduforge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      # One turbo run builds each package once, in dependency order (cached in .turbo/cache).
      - run: pnpm exec turbo run build --filter=@eduforge/chess-core --filter=@eduforge/shared --filter=@eduforge/content
      - run: pnpm --filter @eduforge/db test
      - run: node scripts/verify-labs.mjs
