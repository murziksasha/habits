services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduforge}
      POSTGRES_DB: ${POSTGRES_DB:-eduforge}
    # Host 5433 avoids clashing with other local Postgres (e.g. another compose project on 5432).
    # In-container hostname remains postgres:5432 for api/realtime.
    ports:
      # Loopback only: reachable from this machine (pnpm dev, psql), not from the network.
      # Host port overridable when 5432 is taken by another project.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-eduforge-dev-redis}
    # Password from env ($$ = expanded by the container shell, not by compose).
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      # Loopback only, see postgres.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduforge}:${POSTGRES_PASSWORD:-eduforge}@postgres:5432/${POSTGRES_DB:-eduforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-eduforge-dev-redis}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}      # Local compose defaults to development so weak AUTH_SECRET is refused only in real production
      NODE_ENV: ${NODE_ENV:-development}
      CRON_SECRET: ${CRON_SECRET:-}
      BACKUP_DIR: /data/backups
      # Engine baked into the image (docker/Dockerfile.api). Fixed value, not interpolated from the host:
      # the host .env may hold a Windows path.
      STOCKFISH_PATH: /usr/local/bin/stockfish
      # Rate limits key on the client IP. 0 = use the socket address and ignore
      # X-Forwarded-For: here the API port is published directly, so clients could
      # forge the header. Set 1 only when the API is reachable solely through
      # docker/nginx.conf (and stop publishing port 4000).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    volumes:
      - backupdata:/data/backups
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  realtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.realtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduforge}:${POSTGRES_PASSWORD:-eduforge}@postgres:5432/${POSTGRES_DB:-eduforge}
      REDIS_URL: redis://:${REDIS_PASSWORD:-eduforge-dev-redis}@redis:6379
      REALTIME_PORT: 4001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:4001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:4001}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      # DB tools need tsx/drizzle-kit (dev dependencies), so not the slim runner.
      target: tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eduforge}:${POSTGRES_PASSWORD:-eduforge}@postgres:5432/${POSTGRES_DB:-eduforge}
      NODE_ENV: ${NODE_ENV:-development}
      ALLOW_PROD_SEED: ${ALLOW_PROD_SEED:-0}
      # No published defaults: an unset TOTP secret means the admin enrolls 2FA after first login.
      SEED_ADMIN_TOTP_SECRET: ${SEED_ADMIN_TOTP_SECRET:-}
      SEED_ADMIN_BACKUP_CODE: ${SEED_ADMIN_BACKUP_CODE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eduforge.ua}
      # Required (seed refuses to create the admin without it). Set in .env.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: ["sh", "-c", "pnpm --filter @eduforge/db migrate && pnpm --filter @eduforge/db seed"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  # Scheduled Postgres backups (profile: backup): pg_dump -Fc + retention.
  #   docker compose --profile backup up -d pg-backup
  # Files land in PG_BACKUP_DIR on the host — default ../eduforge-pg-backups, i.e.
  # next to the repository, never inside it. Restore: scripts/db/pg-restore.sh
  # (runbook: instructions/backups.md).
  pg-backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-eduforge}
      PGPASSWORD: ${POSTGRES_PASSWORD:-eduforge}
      PGDATABASE: ${POSTGRES_DB:-eduforge}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${PG_BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${PG_BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MIN: ${PG_BACKUP_KEEP_MIN:-3}
    volumes:
      - ./scripts/db/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - ${PG_BACKUP_DIR:-../eduforge-pg-backups}:/backups
    command: ["sh", "/usr/local/bin/pg-backup.sh", "loop"]
    depends_on:
      postgres:
        condition: service_healthy

  # Optional OpenTelemetry collector (profile: otel)
  # Point API: OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["otel"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"
      - "4317:4317"

volumes:
  pgdata:
  backupdata:
