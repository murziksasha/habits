<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ForgeBoard — Broken A11y</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav><a href="#task-board">Board</a></nav>
    </header>
    <main>
      <form id="task-form">

    <footer>ForgeBoard</footer>
