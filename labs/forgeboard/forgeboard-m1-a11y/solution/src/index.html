<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForgeBoard — Team Tasks</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to board</a>
    <header class="site-header">
      <h1>ForgeBoard</h1>
      <nav aria-label="Primary sections">
        <a href="#task-board">Board</a>
        <a href="#task-form-section">Create Task</a>
      </nav>
    </header>

    <main id="main-content" class="workspace">
      <section id="task-form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Task</h2>
        <form id="task-form" novalidate>
          <div class="field">
            <label for="task-title">Task title</label>
            <input
              id="task-title"
              name="title"
              type="text"
              aria-required="true"
              aria-invalid="false"
              aria-describedby="title-hint title-error"
            />
            <p id="title-hint" class="hint">3–120 characters describing the deliverable.</p>
            <p id="title-error" class="error" role="alert"></p>
          </div>
          <button type="submit">Add task</button>
        </form>
      </section>

      <section id="task-board" class="board-shell" aria-labelledby="board-heading">
        <div class="board-header">
          <h2 id="board-heading">Active Tasks</h2>
          <p id="board-status" role="status" aria-live="polite">0 tasks loaded</p>
        </div>
        <ul class="task-grid" id="task-list">
          <li class="task-card">
            <h3>Review migration 0004 before release window opens</h3>
            <button type="button" data-open-dialog="task-dialog">Inspect details</button>
          </li>
        </ul>
      </section>

      <dialog id="task-dialog" aria-labelledby="dialog-title">
        <h2 id="dialog-title">Task Details</h2>
        <p>Use Escape or Close to restore focus back to the trigger button.</p>
        <button type="button" id="close-dialog">Close</button>
      </dialog>
    </main>

    <footer class="site-footer">
      <p>ForgeBoard Local Practice Shell</p>
    </footer>

    <script type="module">
      let lastTrigger = null;
      const dialog = document.getElementById("task-dialog");
      document.querySelectorAll("[data-open-dialog]").forEach((btn) => {
        btn.addEventListener("click", () => {
          lastTrigger = btn;
          dialog?.showModal?.();
        });
      });
      document.getElementById("close-dialog")?.addEventListener("click", () => {
        dialog?.close?.();
        lastTrigger?.focus();
      });
    </script>
  </body>
</html>
