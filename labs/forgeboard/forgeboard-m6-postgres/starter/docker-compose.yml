services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-forgeboard}
      POSTGRES_PASSWORD: ${PGPASSWORD:-forgeboard}
      POSTGRES_DB: ${PGDATABASE:-forgeboard}
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-forgeboard}"]
      interval: 5s
      timeout: 3s
      retries: 10
